# Every push of every branch of the fork, checked in a runner once it reaches
# GitHub (maintainer, 2026-09-28, #312): the tree and the pushed commits'
# messages against the wordlist the fork must not carry. The list is the
# repository secret FORBIDDEN_PATTERNS, never a file in the tree; without it
# tools/forbidden-terms-check exits 2 and this job is red, which is the point.
# The local half is .githooks/ (pre-commit, commit-msg, pre-push).
# Fork-only (`fork-*`): never part of an upstream PR.
name: fork wordlist check

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wordlist:
    runs-on: ubuntu-24.04
    env:
      FORBIDDEN_PATTERNS: ${{ secrets.FORBIDDEN_PATTERNS }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: the tree carries no listed word
        run: ./tools/forbidden-terms-check
      - name: no pushed commit message carries a listed word
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -uo pipefail
          case "${BEFORE:-}" in
            ''|0000000000000000000000000000000000000000) range="-n 50 ${AFTER}" ;;   # a new branch: its last fifty
            *) if git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then range="${BEFORE}..${AFTER}"; else range="-n 50 ${AFTER}"; fi ;;
          esac
          # shellcheck disable=SC2086
          git log --format=%B ${range} | ./tools/forbidden-terms-check --stdin
